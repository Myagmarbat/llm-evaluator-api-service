[project]
name = "llm-evaluator-api-service"
version = "1.0.0"
description = "LLM proxy with asynchronous shadow evaluation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: integration tests against a deployed App Platform URL (requires INTEGRATION_APP_URL)",
]
