name: CD

on:
  push:
    branches: [main, master]
    paths:
      - "llm-evaluator-api-service/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-llm-evaluator-api-service-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
  TF_VAR_inference_api_key: ${{ secrets.INFERENCE_API_KEY }}
  TF_IN_AUTOMATION: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-evaluator-api-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-evaluator-api-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Configure Terraform backend
        working-directory: llm-evaluator-api-service/terraform
        run: |
          if [ -n "${{ secrets.TF_STATE_BUCKET }}" ]; then
            terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="key=llm-evaluator-api-service/terraform.tfstate" \
              -backend-config="region=us-east-1" \
              -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
              -backend-config="skip_credentials_validation=true" \
              -backend-config="skip_requesting_account_id=true" \
              -backend-config="skip_metadata_api_check=true" \
              -backend-config="skip_region_validation=true" \
              -backend-config="skip_s3_checksum=true"
          else
            echo "::warning::TF_STATE_BUCKET not set — using ephemeral local Terraform state"
            terraform init -backend=false
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}

      - name: Ensure container registry exists
        working-directory: llm-evaluator-api-service/terraform
        run: |
          terraform apply -auto-approve \
            -target=digitalocean_container_registry.this \
            -target=digitalocean_container_registry_docker_credentials.this

      - name: Log in to DOCR
        run: doctl registry login

      - name: Build and push image
        run: |
          REGISTRY_ENDPOINT=$(cd llm-evaluator-api-service/terraform && terraform output -raw registry_endpoint)
          IMAGE="${REGISTRY_ENDPOINT}/llm-evaluator-api-service:${IMAGE_TAG}"
          docker build -t "${IMAGE}" -t "${REGISTRY_ENDPOINT}/llm-evaluator-api-service:latest" llm-evaluator-api-service
          docker push "${IMAGE}"
          docker push "${REGISTRY_ENDPOINT}/llm-evaluator-api-service:latest"

      - name: Deploy App Platform service
        working-directory: llm-evaluator-api-service/terraform
        run: |
          terraform apply -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Print deployment URL
        working-directory: llm-evaluator-api-service/terraform
        run: |
          echo "Deployed to: $(terraform output -raw app_url)"
          echo "Image: $(terraform output -raw image_reference)"
