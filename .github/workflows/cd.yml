name: CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev, production, or both)"
        required: false
        default: both
        type: choice
        options:
          - both
          - dev
          - production
      image_tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
  TF_VAR_inference_api_key: ${{ secrets.INFERENCE_API_KEY }}
  TF_IN_AUTOMATION: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and mocked integration tests
        run: pytest tests/ -m "not live" -v

  deploy-dev:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == 'both'
    environment: dev
    outputs:
      url: ${{ steps.dev_url.outputs.url }}
    env:
      ENVIRONMENT: dev
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${DIGITALOCEAN_TOKEN}" ]; then
            echo "::error::DIGITALOCEAN_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "${INFERENCE_API_KEY}" ]; then
            echo "::error::INFERENCE_API_KEY secret is not set."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Deploy dev
        run: ./scripts/deploy.sh

      - name: Save dev app URL
        id: dev_url
        run: echo "url=$(ENVIRONMENT=dev ./scripts/tf.sh output -raw app_url)" >> "$GITHUB_OUTPUT"

  integration-dev:
    runs-on: ubuntu-latest
    needs: deploy-dev
    env:
      INTEGRATION_APP_URL: ${{ needs.deploy-dev.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Live integration tests (dev)
        run: pytest tests/integration/test_live_api.py -m live -v

  deploy-production:
    runs-on: ubuntu-latest
    needs: integration-dev
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.environment == 'production' ||
      github.event.inputs.environment == 'both'
    environment: production
    outputs:
      url: ${{ steps.prod_url.outputs.url }}
    env:
      ENVIRONMENT: production
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Deploy production
        run: ./scripts/deploy.sh

      - name: Save production app URL
        id: prod_url
        run: echo "url=$(ENVIRONMENT=production ./scripts/tf.sh output -raw app_url)" >> "$GITHUB_OUTPUT"

  integration-production:
    runs-on: ubuntu-latest
    needs: deploy-production
    env:
      INTEGRATION_APP_URL: ${{ needs.deploy-production.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Live integration tests (production)
        run: pytest tests/integration/test_live_api.py -m live -v
