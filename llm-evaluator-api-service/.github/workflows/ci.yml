name: CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: llm-evaluator-api-service

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: llm-evaluator-api-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-evaluator-api-service/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (local backend)
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t llm-evaluator-api-service:ci llm-evaluator-api-service
