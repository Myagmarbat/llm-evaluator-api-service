name: CD

on:
  workflow_call:
    secrets:
      DIGITALOCEAN_TOKEN:
        required: true
      INFERENCE_API_KEY:
        required: true
      TF_STATE_BUCKET:
        required: false
      TF_STATE_REGION:
        required: false
      SPACES_ACCESS_KEY_ID:
        required: false
      SPACES_SECRET_ACCESS_KEY:
        required: false

defaults:
  run:
    working-directory: llm-evaluator-api-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Terraform Init
        working-directory: llm-evaluator-api-service/terraform
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            terraform init -input=false
          else
            sed -i 's/backend "local" {[^}]*}/backend "s3" {}/' versions.tf
            cat > backend.hcl <<EOF
          bucket                      = "${TF_STATE_BUCKET}"
          key                         = "llm-evaluator-api-service/${{ github.ref_name }}/terraform.tfstate"
          region                      = "${TF_STATE_REGION:-nyc3}"
          endpoint                    = "https://${TF_STATE_REGION:-nyc3}.digitaloceanspaces.com"
          access_key                  = "${SPACES_ACCESS_KEY_ID}"
          secret_key                  = "${SPACES_SECRET_ACCESS_KEY}"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          EOF
            terraform init -reconfigure -backend-config=backend.hcl
          fi

      - name: Deploy
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: prod
        run: ./scripts/deploy.sh

      - name: Output app URL
        id: deploy
        working-directory: llm-evaluator-api-service/terraform
        run: echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
